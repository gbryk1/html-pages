spring.application.name=notevault

# Sesje w Redisie; "indexed" pozwala szukać sesji po użytkowniku (limit sesji)
spring.session.data.redis.repository-type=indexed
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Keycloak jako wystawca tokenów dla /ext/**
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/notevault
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/notevault/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.audiences=notevault-api

# Hasło startowego admina: puste = brak konta admina (w produkcji z Docker secret)
notevault.admin.password=
notevault.cors.allowed-origins=http://localhost:5173

management.endpoints.web.exposure.include=health
